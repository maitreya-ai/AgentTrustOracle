services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ato
      POSTGRES_PASSWORD: ato
      POSTGRES_DB: ato
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ato -d ato"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
