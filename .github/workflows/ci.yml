name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun test
      - name: build landing page (includes its typecheck)
        run: bun run build:web
      - name: program ids in sync
        run: bun run program:keys --check
      - name: parity fixtures up to date
        run: bun run fixtures && git diff --exit-code fixtures/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the host toolchain (Anchor 1.2 MSRV); rustup installs it.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # LiteSVM lifecycle tests skip unless target/deploy/trust_oracle.so exists (see sbf job).
      - run: cargo test --workspace

  sbf:
    # Builds the onchain binary and runs the LiteSVM lifecycle tests against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Toolchain downloads (agave release, platform-tools from GitHub releases) are flaky:
      # restore from cache, retry installs, and save the cache as soon as both succeed.
      - name: restore solana toolchain
        id: solana-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-agave-v4.4.1-gh-platform-tools-${{ runner.os }}
      - name: install agave (solana) cli
        if: steps.solana-cache.outputs.cache-hit != 'true'
        # Straight from the GitHub release (the release.anza.xyz installer has served
        # truncated archives to CI runners); curl retries 5xx and broken transfers.
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o /tmp/agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.4.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          mkdir -p "$HOME/.local/share/solana/install/active_release"
          tar -xjf /tmp/agave.tar.bz2 -C "$HOME/.local/share/solana/install/active_release" --strip-components=1
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: install platform-tools
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            cargo build-sbf --install-only && exit 0
            echo "platform-tools attempt $attempt failed; retrying" && sleep $((attempt * 20))
          done
          exit 1
      - name: save solana toolchain
        if: steps.solana-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-agave-v4.4.1-gh-platform-tools-${{ runner.os }}
      - run: cargo build-sbf --manifest-path programs/trust-oracle/Cargo.toml
      - run: ls -la target/deploy/trust_oracle.so
      - run: cargo test -p program-tests
        env:
          REQUIRE_SBF: "1"
