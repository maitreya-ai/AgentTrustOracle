[workspace]
members = ["programs/*", "crates/*", "examples/*", "tests/program"]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
repository = "https://github.com/maitreya-ai/AgentTrustOracle"

[workspace.dependencies]
anchor-lang = "1.2.2"
solana-sha256-hasher = "3.1.0"
trust-oracle-interface = { path = "crates/trust-oracle-interface" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
